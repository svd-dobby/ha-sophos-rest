add_dhcp_reservation:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: sophos_rest
    server:
      required: true
      example: GuestAccess_DHCP
      selector:
        text:
    name:
      required: true
      example: TEST_HA
      selector:
        text:
    mac:
      required: true
      example: "02:00:00:00:00:01"
      selector:
        text:
    ip:
      required: true
      example: 10.255.0.50
      selector:
        text:
    dry_run:
      default: false
      selector:
        boolean:

remove_dhcp_reservation:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: sophos_rest
    server:
      required: true
      example: GuestAccess_DHCP
      selector:
        text:
    mac:
      example: "02:00:00:00:00:01"
      selector:
        text:
    ip:
      example: 10.255.0.50
      selector:
        text:
    dry_run:
      default: false
      selector:
        boolean:

set_dhcp_pools:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: sophos_rest
    server:
      required: true
      example: GuestAccess_DHCP
      selector:
        text:
    pools:
      required: true
      example: '["10.255.0.100-10.255.0.200"]'
      selector:
        text:
          multiple: true
    dry_run:
      default: false
      selector:
        boolean:

set_dhcp_lease_time:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: sophos_rest
    server:
      required: true
      example: GuestAccess_DHCP
      selector:
        text:
    default_lease_time:
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 43200
          unit_of_measurement: min
          mode: box
    max_lease_time:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 43200
          unit_of_measurement: min
          mode: box
    dry_run:
      default: false
      selector:
        boolean:
